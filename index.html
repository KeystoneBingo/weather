<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — Muncy, PA & Angeles City, PH</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface:#ffffff;
  --surface2:#fafaf7;
  --border:rgba(0,0,0,0.09);
  --border-mid:rgba(0,0,0,0.15);
  --text:#1a1a18;
  --text2:#555550;
  --text3:#999990;
  --blue-fill:#B5D4F4;
  --blue-stroke:#378ADD;
  --blue-text:#0C447C;
  --blue-bg:#E6F1FB;
  --amber-fill:#FAC775;
  --amber-stroke:#EF9F27;
  --r:12px;
  --r-sm:8px;
}
body{font-family:'DM Sans',sans-serif;background:#f5f4f0;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:2rem 1rem}
.widget{width:100%;max-width:960px}
.wx-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
@media(max-width:600px){.wx-grid{grid-template-columns:1fr}}
.wx-panel{display:flex;flex-direction:column;gap:8px}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);text-align:center;padding-top:4px}
.wx-main{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:1.25rem;display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem}
.wx-location{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:2px}
.wx-localtime{font-size:10px;color:var(--text3);margin-bottom:6px}
.wx-temp-row{display:flex;align-items:flex-start;gap:2px;margin-bottom:4px}
.wx-temp{font-size:52px;font-weight:500;line-height:1;color:var(--text)}
.wx-unit{font-size:22px;color:var(--text3);margin-top:5px}
.wx-cond{font-size:12px;color:var(--text2)}
.wx-details{background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:0}
.wx-det{padding:5px 0;border-bottom:0.5px solid var(--border)}
.wx-det:nth-last-child(-n+2){border-bottom:none}
.wx-det-label{font-size:10px;color:var(--text3);margin-bottom:2px}
.wx-det-val{font-size:12px;font-weight:500;color:var(--text)}
.wx-forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.wx-day{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-sm);padding:8px 4px;text-align:center}
.wx-day.today{border-color:var(--blue-stroke);background:var(--blue-bg)}
.wx-day-name{font-size:10px;font-weight:600;letter-spacing:0.04em;color:var(--text3);margin-bottom:6px}
.wx-day.today .wx-day-name{color:var(--blue-text)}
.wx-day-hi{font-size:13px;font-weight:500;color:var(--text);margin-top:4px}
.wx-day.today .wx-day-hi{color:var(--blue-text)}
.wx-day-precip{font-size:9px;margin-top:3px;padding:2px 4px;border-radius:8px;display:inline-block;font-weight:500}
.precip-lo{background:var(--surface2);color:var(--text3)}
.precip-md{background:var(--blue-bg);color:var(--blue-text)}
.precip-hi{background:var(--blue-stroke);color:#fff}
.precip-snow{background:#E8F4FB;color:#1a5a8a}
.wx-footer{font-size:11px;color:var(--text3);text-align:center;padding-top:8px}
.wx-refresh{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;text-decoration:underline}
.wx-refresh:hover{color:var(--text2)}
.skeleton{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.skel-block{background:var(--surface2);border-radius:4px;height:12px;margin-bottom:6px}
</style>
</head>
<body>
<div class="widget">
  <div class="wx-grid" id="wxGrid">
    <div class="wx-panel">
      <div class="section-label">Muncy, PA</div>
      <div id="wx-muncy"><div class="wx-main skeleton"><div style="width:100%"><div class="skel-block" style="width:60%;height:40px;margin-bottom:8px"></div><div class="skel-block" style="width:80%"></div><div class="skel-block" style="width:50%"></div></div></div></div>
    </div>
    <div class="wx-panel">
      <div class="section-label">Angeles City, PH</div>
      <div id="wx-angeles"><div class="wx-main skeleton"><div style="width:100%"><div class="skel-block" style="width:60%;height:40px;margin-bottom:8px"></div><div class="skel-block" style="width:80%"></div><div class="skel-block" style="width:50%"></div></div></div></div>
    </div>
  </div>
  <div class="wx-footer" id="wxFooter" style="display:none">
    <button class="wx-refresh" onclick="initAll()">Refresh</button>
  </div>
</div>

<script>
const LOCATIONS = [
  {id:'muncy',    name:'Muncy, PA',          lat:41.2045,  lon:-76.7858, tz:'America/New_York'},
  {id:'angeles',  name:'Angeles City, PH',   lat:15.1450,  lon:120.5887, tz:'Asia/Manila'},
];

const WMO = {
  0:{label:'Clear sky',icon:'sunny'},1:{label:'Mainly clear',icon:'mostly_sunny'},2:{label:'Partly cloudy',icon:'partly_cloudy'},3:{label:'Overcast',icon:'cloudy'},
  45:{label:'Foggy',icon:'cloudy'},48:{label:'Icy fog',icon:'cloudy'},51:{label:'Light drizzle',icon:'rainy'},53:{label:'Drizzle',icon:'rainy'},55:{label:'Heavy drizzle',icon:'rainy'},
  61:{label:'Light rain',icon:'rainy'},63:{label:'Rain',icon:'rainy'},65:{label:'Heavy rain',icon:'rainy'},71:{label:'Light snow',icon:'snowy'},73:{label:'Snow',icon:'snowy'},
  75:{label:'Heavy snow',icon:'snowy'},77:{label:'Snow grains',icon:'snowy'},80:{label:'Light showers',icon:'rainy'},81:{label:'Showers',icon:'rainy'},82:{label:'Heavy showers',icon:'rainy'},
  85:{label:'Snow showers',icon:'snowy'},86:{label:'Heavy snow showers',icon:'snowy'},95:{label:'Thunderstorm',icon:'stormy'},96:{label:'T-storm w/ hail',icon:'stormy'},99:{label:'T-storm w/ hail',icon:'stormy'},
};

function windDir(deg){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];}
function getDayName(dateStr){const d=new Date(dateStr+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short'});}
function precipClass(p){return p>=60?'precip-hi':p>=30?'precip-md':'precip-lo';}
function getLocalTime(tz){try{return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:tz});}catch(e){return '';}}

function getIcon(type, size=36){
  const s=size, h=size, cx=s/2, cy=s/2;
  if(type==='sunny'){
    return `<svg width="${s}" height="${h}" viewBox="0 0 ${s} ${h}" fill="none">
      <circle cx="${cx}" cy="${cy}" r="${s*.22}" fill="#FAC775" stroke="#EF9F27" stroke-width="${s*.04}"/>
      ${[0,45,90,135,180,225,270,315].map(a=>{const r1=s*.32,r2=s*.44,x1=cx+r1*Math.cos(a*Math.PI/180),y1=cy+r1*Math.sin(a*Math.PI/180),x2=cx+r2*Math.cos(a*Math.PI/180),y2=cy+r2*Math.sin(a*Math.PI/180);return`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#EF9F27" stroke-width="${s*.05}" stroke-linecap="round"/>`;}).join('')}
    </svg>`;
  }
  if(type==='mostly_sunny'||type==='partly_cloudy'){
    const scx=cx*.9, scy=cy*.7, sr=s*.18;
    return `<svg width="${s}" height="${h}" viewBox="0 0 ${s} ${h}" fill="none">
      <circle cx="${scx}" cy="${scy}" r="${sr}" fill="#FAC775" stroke="#EF9F27" stroke-width="${s*.03}"/>
      ${[0,60,120,180,240,300].map(a=>{const r1=sr+s*.04,r2=sr+s*.1,x1=scx+r1*Math.cos(a*Math.PI/180),y1=scy+r1*Math.sin(a*Math.PI/180),x2=scx+r2*Math.cos(a*Math.PI/180),y2=scy+r2*Math.sin(a*Math.PI/180);return`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#EF9F27" stroke-width="${s*.04}" stroke-linecap="round"/>`;}).join('')}
      <path d="M${s*.1} ${h*.72} Q${s*.1} ${h*.45} ${s*.35} ${h*.45} Q${s*.38} ${h*.3} ${s*.58} ${h*.3} Q${s*.8} ${h*.3} ${s*.82} ${h*.5} Q${s*.95} ${h*.52} ${s*.95} ${h*.72} Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="${s*.025}"/>
    </svg>`;
  }
  if(type==='cloudy'){
    return `<svg width="${s}" height="${h}" viewBox="0 0 ${s} ${h}" fill="none">
      <path d="M${s*.06} ${h*.75} Q${s*.06} ${h*.44} ${s*.32} ${h*.44} Q${s*.36} ${h*.25} ${s*.6} ${h*.25} Q${s*.85} ${h*.25} ${s*.87} ${h*.48} Q${s*.98} ${h*.5} ${s*.98} ${h*.68} Q${s*.98} ${h*.75} ${s*.9} ${h*.75} Z" fill="#B4B2A9" stroke="#888780" stroke-width="${s*.025}"/>
    </svg>`;
  }
  if(type==='rainy'){
    return `<svg width="${s}" height="${h}" viewBox="0 0 ${s} ${h}" fill="none">
      <path d="M${s*.06} ${h*.6} Q${s*.06} ${h*.3} ${s*.32} ${h*.3} Q${s*.36} ${h*.12} ${s*.6} ${h*.12} Q${s*.85} ${h*.12} ${s*.87} ${h*.34} Q${s*.98} ${h*.36} ${s*.98} ${h*.54} Q${s*.98} ${h*.6} ${s*.9} ${h*.6} Z" fill="#B4B2A9" stroke="#888780" stroke-width="${s*.025}"/>
      ${[[.2,.75],[.38,.82],[.56,.75],[.74,.82],[.85,.75]].map(([x,y])=>`<circle cx="${s*x}" cy="${h*y}" r="${s*.04}" fill="#378ADD"/>`).join('')}
      ${[[.29,.9],[.47,.97],[.65,.9]].map(([x,y])=>`<circle cx="${s*x}" cy="${h*y}" r="${s*.04}" fill="#378ADD"/>`).join('')}
    </svg>`;
  }
  if(type==='snowy'){
    return `<svg width="${s}" height="${h}" viewBox="0 0 ${s} ${h}" fill="none">
      <path d="M${s*.06} ${h*.6} Q${s*.06} ${h*.3} ${s*.32} ${h*.3} Q${s*.36} ${h*.12} ${s*.6} ${h*.12} Q${s*.85} ${h*.12} ${s*.87} ${h*.34} Q${s*.98} ${h*.36} ${s*.98} ${h*.54} Q${s*.98} ${h*.6} ${s*.9} ${h*.6} Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="${s*.025}"/>
      ${[[.2,.75],[.38,.82],[.56,.75],[.74,.82],[.85,.75]].map(([x,y])=>`<circle cx="${s*x}" cy="${h*y}" r="${s*.04}" fill="#B5D4F4"/>`).join('')}
      ${[[.29,.9],[.47,.97],[.65,.9]].map(([x,y])=>`<circle cx="${s*x}" cy="${h*y}" r="${s*.04}" fill="#B5D4F4"/>`).join('')}
    </svg>`;
  }
  if(type==='stormy'){
    return `<svg width="${s}" height="${h}" viewBox="0 0 ${s} ${h}" fill="none">
      <path d="M${s*.06} ${h*.58} Q${s*.06} ${h*.28} ${s*.32} ${h*.28} Q${s*.36} ${h*.1} ${s*.6} ${h*.1} Q${s*.85} ${h*.1} ${s*.87} ${h*.32} Q${s*.98} ${h*.34} ${s*.98} ${h*.52} Q${s*.98} ${h*.58} ${s*.9} ${h*.58} Z" fill="#888780" stroke="#5F5E5A" stroke-width="${s*.025}"/>
      <polyline points="${s*.48},${h*.6} ${s*.38},${h*.78} ${s*.52},${h*.78} ${s*.42},${h*.97}" stroke="#EF9F27" stroke-width="${s*.06}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>`;
  }
  return `<svg width="${s}" height="${h}" viewBox="0 0 ${s} ${h}" fill="none"><circle cx="${cx}" cy="${cy}" r="${s*.3}" fill="#D3D1C7"/></svg>`;
}

async function fetchWeather(loc){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,is_day&daily=weather_code,temperature_2m_max,precipitation_probability_max&wind_speed_unit=mph&temperature_unit=fahrenheit&timezone=${encodeURIComponent(loc.tz)}&forecast_days=5`;
  const res=await fetch(url);
  if(!res.ok) throw new Error('API error');
  return res.json();
}

function renderPanel(loc, data){
  const c=data.current, d=data.daily;
  const wmo=WMO[c.weather_code]||{label:'Unknown',icon:'cloudy'};
  const temp=Math.round(c.temperature_2m);
  const feels=Math.round(c.apparent_temperature);
  const humidity=Math.round(c.relative_humidity_2m);
  const wind=Math.round(c.wind_speed_10m);
  const windD=windDir(c.wind_direction_10m);
  const todayHi=Math.round(d.temperature_2m_max[0]);
  const localTime=getLocalTime(loc.tz);

  const forecastHTML=d.temperature_2m_max.map((hi,i)=>{
    const dayWmo=WMO[d.weather_code[i]]||{label:'',icon:'cloudy'};
    const precip=Math.round(d.precipitation_probability_max[i]);
    const isToday=i===0;
    const isSnow=d.weather_code[i]>=71&&d.weather_code[i]<=77;
    const precipSpan=isSnow
      ?`<span class="wx-day-precip precip-snow">${precip}%</span>`
      :`<span class="wx-day-precip ${precipClass(precip)}">${precip}%</span>`;
    return`<div class="wx-day${isToday?' today':''}">
      <div class="wx-day-name">${isToday?'Today':getDayName(d.time[i])}</div>
      ${getIcon(dayWmo.icon, 24)}
      <div class="wx-day-hi">${Math.round(hi)}°</div>
      ${precipSpan}
    </div>`;
  }).join('');

  document.getElementById('wx-'+loc.id).innerHTML=`
    <div class="wx-main">
      <div>
        <div class="wx-location">${loc.name}</div>
        <div class="wx-localtime">${localTime} local</div>
        <div class="wx-temp-row"><div class="wx-temp">${temp}</div><div class="wx-unit">°F</div></div>
        <div class="wx-cond">${wmo.label}</div>
      </div>
      <div>${getIcon(wmo.icon, 60)}</div>
    </div>
    <div class="wx-details">
      <div class="wx-det"><div class="wx-det-label">Today's high</div><div class="wx-det-val">${todayHi}°F</div></div>
      <div class="wx-det"><div class="wx-det-label">Feels like</div><div class="wx-det-val">${feels}°F</div></div>
      <div class="wx-det"><div class="wx-det-label">Humidity</div><div class="wx-det-val">${humidity}%</div></div>
      <div class="wx-det"><div class="wx-det-label">Wind</div><div class="wx-det-val">${wind} mph ${windD}</div></div>
    </div>
    <div class="wx-forecast">${forecastHTML}</div>
  `;
}

async function initAll(){
  LOCATIONS.forEach(loc=>{
    document.getElementById('wx-'+loc.id).innerHTML=`<div class="wx-main skeleton"><div style="width:100%"><div class="skel-block" style="width:60%;height:40px;margin-bottom:8px"></div><div class="skel-block" style="width:80%"></div><div class="skel-block" style="width:50%"></div></div></div>`;
  });
  document.getElementById('wxFooter').style.display='none';
  await Promise.all(LOCATIONS.map(async loc=>{
    try{
      const data=await fetchWeather(loc);
      renderPanel(loc,data);
    }catch(e){
      document.getElementById('wx-'+loc.id).innerHTML=`<div class="wx-main" style="color:#555550;font-size:13px;">Unable to load weather. Check your connection.</div>`;
    }
  }));
  document.getElementById('wxFooter').style.display='block';
}

initAll();
</script>
</body>
</html>
